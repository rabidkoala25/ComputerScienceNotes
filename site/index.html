<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Set the theme before first paint to avoid a flash.
    (function () {
      var t;
      try { t = localStorage.getItem('notes-theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (location.hash.indexOf('#/share/') === 0) document.documentElement.classList.add('share-mode');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <button type="button" id="menu-toggle" class="icon-btn" aria-controls="sidebar" aria-label="Show notes list">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a href="#/" class="topbar-title" data-site-title>Notes</a>
  </header>

  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Notes">
      <div class="brand">
        <a href="#/" class="brand-title" data-site-title>Notes</a>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch to dark theme">
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <a href="#/new" class="btn new-note">New note</a>

      <div class="search">
        <label for="search" class="visually-hidden">Search notes</label>
        <input id="search" type="search" placeholder="Search notes" autocomplete="off" spellcheck="false">
        <kbd class="search-key" aria-hidden="true">/</kbd>
      </div>
      <p class="search-hint">Try <code>tag:arrays</code>, <code>topic:data</code> or <code>lang:python</code></p>

      <div id="filters" class="filters"></div>

      <div class="list-head">
        <span id="count" aria-live="polite"></span>
        <label class="visually-hidden" for="sort">Sort notes</label>
        <select id="sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="updated">Recently edited</option>
          <option value="title">By title</option>
        </select>
      </div>
      <nav id="note-list" class="note-list" aria-label="Note list"></nav>
    </aside>

    <main id="main" tabindex="-1"></main>
  </div>

  <div id="scrim" class="scrim" hidden></div>
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-label="Image preview">
    <img alt="">
    <p class="lightbox-cap"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
